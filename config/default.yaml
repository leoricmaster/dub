# Pipeline default settings
# Override per-run via CLI flags or a custom YAML passed with --config.

pipeline:
  cache_dir: .dub-cache
  output_dir: ./output

# Stage: extract audio from container
extract:
  sample_rate: 16000        # Whisper/Paraformer-friendly rate
  mono: true

# Stage: speech-to-text
asr:
  provider: dashscope       # only dashscope implemented in P1
  model: paraformer-v2
  language_hints: [en]      # bias toward English narration
  # Internally downloads result with word-level timestamps.

# Stage: translation
translate:
  provider: deepseek
  model: deepseek-chat
  temperature: 0.3
  # Chinese chars per second of original audio - used to ask LLM
  # to chunk long translations to match original timing.
  max_chars_per_second: 3.5
  # Number of source segments to translate in one LLM call (for context)
  context_window: 8
  refit: true               # E2 rung ①: re-translate over-budget segments before TTS

# Stage: text-to-speech
tts:
  provider: minimax
  model: speech-2.8-hd      # MiniMax T2A HD model (natural/expressive; was speech-01-turbo)
  audio_format: wav
  sample_rate: 24000
  max_speed: 1.2            # E2 rung ②: cap for speed re-synth

# Stage: separate vocals from accompaniment (E7 - local Demucs)
# Produces accompaniment (music/SFX, English vocals removed) which mix uses as
# its bed. Requires the optional [sep] extra (pip install -e '.[sep]') and a
# CUDA GPU for speed; falls back to whole-track attenuation if unavailable.
separate:
  enabled: true
  provider: demucs
  model: htdemucs_ft        # Demucs v4 hybrid transformer (fine-tuned)
  two_stems: vocals         # emit vocals.wav + no_vocals.wav
  device: cuda              # cuda | cpu
  sample_rate: 44100        # HQ feed extract rate
  channels: 2
  hf_endpoint: https://hf-mirror.com  # HF mirror (demucs fetches models from HF first);
                                       # mainland-China friendly. "" = upstream.

# Stage: mix Chinese dub over the accompaniment bed
# - accompaniment mode (default, when separation succeeded): dip the bed by
#   duck_db under each Chinese clip, overlay Chinese. Music swells between lines.
# - attenuate mode (fallback): lower the whole original by bg_attenuation_db.
mix:
  duck_db: -4               # accompaniment mode: dip bed under Chinese speech
  bg_attenuation_db: -12    # attenuate mode (fallback) only
  sample_rate: 48000

# E2 timing-fit remediation (rung ②③): fit Chinese clips into segment windows.
remediate:
  tolerance_ms: 50          # within this much of the window counts as "fit"
  min_window_ms: 200        # smaller windows are degenerate -> truncate
  max_atempo: 1.5           # ffmpeg atempo factor beyond which we truncate instead

# Stage: mux back into container
mux:
  language: chi             # ISO 639-2 code for Mandarin
  title: "Chinese (AI Dubbed)"
  set_default: false        # don't force the new track as default
