# Voice presets per documentary style.
#
# MiniMax T2A voice_ids are NOT the same as the names shown in the web console,
# and the old "male-qn-*" guess list was partly wrong. Probed against
# speech-01-turbo (2026-08), VALID ids include:
#   presenter_male     播音男声 ← best fit for documentary narration
#   presenter_female   播音女声
#   male-qn-qingse     清澈青年男声
#   male-qn-badao      霸道男声
#   male-qn-daxuesheng 大学生男声
# INVALID (will return status 2054 'voice id not exist'): male-qn-jingqiang,
#   male-qn-yuanbo, narrator_*, news_*, commentator_*.
#
# `nature` uses presenter_male. To preview/compare more ids:
#   https://www.minimaxi.com/platform/tts
# Invalid voice_ids surface as a clear MiniMax API error at TTS time.

nature:                       # BBC nature: Blue Planet, Planet Earth
  provider: minimax
  voice_id: presenter_male    # 播音男声 — broadcaster/narrator, documentary gravitas
  speed: 0.95
  vol: 1.0
  pitch: 0
  language_boost: Chinese     # top-level MiniMax param, biases Mandarin output
  emotion: neutral

food:                         # food / culture, 舌尖-style
  provider: minimax
  voice_id: male-qn-badao
  speed: 0.92
  vol: 1.0
  pitch: 0
  language_boost: Chinese

science:                      # popular science
  provider: minimax
  voice_id: female-shaonv
  speed: 1.0
  vol: 1.0
  pitch: 0
  language_boost: Chinese

history:                      # history / humanities
  provider: minimax
  voice_id: presenter_male    # male-qn-jingqiang is invalid; reuse presenter_male for now
  speed: 0.95
  vol: 1.0
  pitch: 0
  language_boost: Chinese
